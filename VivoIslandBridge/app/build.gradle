plugins { id 'com.android.application' }

def ciBuildNumber = System.getenv("GITHUB_RUN_NUMBER") ?: "2"

android {
    namespace 'com.x3x3t.vivoislandbridge'
    compileSdk 35
    defaultConfig {
        applicationId 'com.x3x3t.vivoislandbridge'
        minSdk 26
        targetSdk 35
        versionCode ciBuildNumber.toInteger()
        versionName "0.1." + ciBuildNumber
    }
    signingConfigs {
        stableDevelopment {
            storeFile file("../signing/vivo-island-bridge-dev.keystore")
            storePassword "vivoBridgeDev2026"
            keyAlias "vivoislandbridge"
            keyPassword "vivoBridgeDev2026"
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.stableDevelopment
        }
    }
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.media:media:1.7.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
