name: Build Vivo Island Bridge APK
on:
  push:
    paths:
      - 'VivoIslandBridge/**'
      - '.github/workflows/build-vivo-island-bridge.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: VivoIslandBridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Prepare stable signing key
        run: |
          base64 --decode signing/vivo-island-bridge-dev.keystore.b64 > signing/vivo-island-bridge-dev.keystore
      - name: Build installable APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VivoIslandBridge-debug
          path: VivoIslandBridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
